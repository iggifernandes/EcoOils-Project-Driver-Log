<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Driver Induction</title>
<meta name="theme-color" content="#44a276">
<link rel="icon" href="../icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --green:#44a276; --green-dark:#357f5c; --green-bg:#EAF6F0; --yellow:#FFC600;
  --ink:#231f20; --grey-title:#6e6b6c; --grey-mid:#8a8788; --grey-line:#dcdcdc; --chip:#f4f4f4;
  --fail:#b3261e; --amber:#a37a00; --radius:8px;
  --maxw:620px;
}
@media (min-width:1100px){:root{--maxw:760px;}}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:'Jost',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#fff;color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100vh;}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 18px 64px;}
.topbar{position:relative;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:22px 0 14px;border-bottom:1px solid var(--grey-line);margin-bottom:22px;}
.topbar:after{content:"";position:absolute;left:0;bottom:-1px;width:44px;height:4px;background:var(--green);}
.brand{display:flex;flex-direction:column;gap:6px;min-width:0;}
.brand-top{font-weight:700;font-size:15px;letter-spacing:.05em;color:var(--green);}
.brand-title{font-weight:300;font-size:18px;letter-spacing:.14em;text-transform:uppercase;color:var(--grey-title);line-height:1.3;}
.brand-sub{font-size:12.5px;color:var(--grey-mid);letter-spacing:.02em;}
.topbar-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none;}
.version{font-size:12px;color:var(--grey-title);letter-spacing:.06em;}
.langtoggle{display:flex;}
.langtoggle button{border:none;background:none;color:var(--grey-title);font-family:inherit;font-size:14px;letter-spacing:.06em;padding:4px 8px;cursor:pointer;border-bottom:3px solid transparent;min-height:30px;}
.langtoggle button.active{color:var(--ink);font-weight:600;border-bottom-color:var(--green);}
.card{background:#fff;border:1px solid var(--grey-line);border-radius:var(--radius);padding:22px 20px;margin-bottom:16px;}
.step-title{font-size:13px;font-weight:500;letter-spacing:.09em;text-transform:uppercase;color:var(--grey-title);margin:0 0 6px;}
h2{font-weight:500;font-size:20px;margin:0 0 14px;line-height:1.3;}
p{line-height:1.6;font-size:15px;margin:0 0 12px;}
.muted{color:var(--grey-mid);font-size:13px;}
.progress{height:4px;background:var(--chip);border-radius:3px;margin:0 0 18px;overflow:hidden;}
.progress i{display:block;height:100%;background:var(--green);transition:width .25s;}
.bullets{list-style:none;padding:0;margin:0;}
.bullets li{position:relative;padding:0 0 12px 22px;font-size:15px;line-height:1.55;}
.bullets li:before{content:"";position:absolute;left:2px;top:9px;width:7px;height:7px;border-radius:50%;background:var(--green);}
.bullets li b{font-weight:600;}
.tbc{color:var(--amber);font-style:italic;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:14.5px;font-weight:500;margin-bottom:7px;}
.field .req{color:var(--fail);}
.field input,.field select{width:100%;padding:12px 13px;border:1px solid var(--grey-line);border-radius:8px;font-family:inherit;font-size:15px;background:#fff;color:var(--ink);}
.field input:focus,.field select:focus{outline:2px solid var(--green);outline-offset:1px;border-color:var(--green);}
.field .hint{font-size:12px;color:var(--grey-mid);margin-top:5px;line-height:1.5;}
.field .err{font-size:12.5px;color:var(--fail);margin-top:5px;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media (max-width:420px){.row2{grid-template-columns:1fr;}}
.confirm-gate{display:flex;gap:11px;align-items:flex-start;padding:13px 14px;border:1.5px solid var(--grey-line);border-radius:9px;margin-top:10px;cursor:pointer;font-size:14px;line-height:1.5;}
.confirm-gate input{width:20px;height:20px;margin-top:1px;flex:none;accent-color:var(--green);}
.confirm-gate a{color:#0A5C9E;text-decoration:underline;font-weight:600;}
.btn-row{display:flex;gap:10px;margin-top:20px;}
.btn{flex:1;padding:14px 16px;border-radius:9px;border:none;font-family:inherit;font-size:15px;font-weight:600;letter-spacing:.02em;cursor:pointer;}
.btn-primary{background:var(--green);color:#fff;}
.btn-primary:hover{background:var(--green-dark);}
.btn-primary:disabled{background:#A9D2BE;cursor:not-allowed;}
.btn-secondary{background:#fff;color:var(--ink);border:1.5px solid var(--grey-line);flex:0 0 auto;padding:14px 18px;}
.note{border-left:3px solid var(--amber);background:#FFF7D6;border-radius:6px;padding:12px 14px;font-size:13.5px;line-height:1.55;color:#5c4400;margin:12px 0;}
.note.info{border-left-color:var(--green);background:var(--green-bg);color:#1f4d38;}
.note.danger{border-left-color:var(--fail);background:#FBEAE9;color:#7a1a14;}
.opt{display:block;width:100%;text-align:left;border:1.5px solid var(--grey-line);background:#fff;border-radius:9px;padding:13px 14px;font-family:inherit;font-size:15px;line-height:1.45;color:var(--ink);cursor:pointer;margin-bottom:10px;}
.opt.sel{border-color:var(--green);background:var(--green-bg);color:var(--green-dark);font-weight:500;}
.opt.correct{border-color:var(--green);background:var(--green-bg);color:var(--green-dark);font-weight:600;}
.opt.wrong{border-color:var(--fail);background:#FBEAE9;color:#7a1a14;font-weight:600;}
.opt:disabled{cursor:default;opacity:.92;}
.photo-box{border:1.5px dashed var(--grey-line);border-radius:var(--radius);padding:18px;text-align:center;cursor:pointer;}
.photo-box.has{border-style:solid;border-color:var(--green);padding:0;overflow:hidden;}
.photo-box img{width:100%;display:block;max-height:300px;object-fit:contain;background:#111;}
.big{font-size:44px;font-weight:300;letter-spacing:.04em;}
.pass{color:var(--green-dark);} .failc{color:var(--fail);}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:90;display:flex;align-items:center;justify-content:center;padding:18px;}
.modal .box{background:#fff;border-radius:12px;max-width:520px;width:100%;max-height:85vh;overflow:auto;padding:22px 20px;}
.modal h3{margin:0 0 10px;font-weight:600;font-size:17px;}
.camera-modal{position:fixed;inset:0;background:#000;z-index:100;display:flex;align-items:center;justify-content:center;}
.camera-modal video{width:100%;height:100%;object-fit:cover;}
.cam-top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:16px 18px;z-index:2;}
.cam-x{width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;border:none;font-size:18px;cursor:pointer;}
.cam-hint{color:#fff;font-size:12.5px;background:rgba(0,0,0,.5);padding:6px 12px;border-radius:20px;}
.cam-bottom{position:absolute;bottom:0;left:0;right:0;padding:28px 0 34px;display:flex;justify-content:center;z-index:2;background:linear-gradient(transparent,rgba(0,0,0,.45));}
.shutter{width:68px;height:68px;border-radius:50%;background:#fff;border:4px solid rgba(255,255,255,.4);cursor:pointer;}
table.t{width:100%;border-collapse:collapse;font-size:13.5px;}
table.t td,table.t th{padding:8px 6px;border-bottom:1px solid var(--grey-line);text-align:left;vertical-align:top;}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11.5px;font-weight:600;letter-spacing:.03em;}
.tag.ok{background:var(--green-bg);color:var(--green-dark);} .tag.wait{background:#FFF7D6;color:var(--amber);} .tag.bad{background:#FBEAE9;color:var(--fail);}
footer{text-align:center;font-size:12px;color:var(--grey-mid);padding-top:14px;line-height:1.9;}
footer a{color:var(--green-dark);cursor:pointer;text-decoration:underline;}
canvas#certCv{width:100%;height:auto;border:1px solid var(--grey-line);border-radius:6px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand">
      <div class="brand-top">ECOOILS</div>
      <div class="brand-title" id="ttl"></div>
      <div class="brand-sub" id="sub"></div>
    </div>
    <div class="topbar-right">
      <div class="version" id="verTag">v1</div>
      <div class="langtoggle" id="lang"></div>
    </div>
  </div>
  <div id="app"></div>
  <footer id="foot"></footer>
</div>

   '**Speed on site:** {{speed}}. Give way to trucks, cranes and heavy equipment, and stay where the operator can see you.',
   '**Passengers** leave the vehicle only at the drop-off point and follow the PPE rule given at the gate.',
   '**Alcohol and drugs:** zero tolerance, before or during driving. Smoking only in designated areas.',
   '**Emergency alarm:** stop safely clear of the road, take your passengers to the assembly point {{assembly}} and wait for HSSE instructions. Emergency contact: {{emergency}}.']},
  {t:'Life Saving Rules that apply to you', i:[
   '**Driving:** everyone wears a seatbelt before the vehicle moves. Obey speed limits. No phone use while driving, hands-free included. No alcohol or drugs. Never drive tired.',
   '**Safe position (line of fire):** keep out of the path of moving vehicles, equipment and loads. If you must stop, stop where you can be seen and are clear of the path.',
   '**Suspended loads:** never drive, park or stand under a load being lifted. Stop well clear and wait.',
   '**Controlled areas:** do not enter anything marked with barriers, tape or hazard signs (permit areas, confined spaces, excavations, gas areas), even to save time.',
   '**Stop and report:** you have the authority to stop any unsafe situation and tell security or HSSE. You will never be punished for stopping safely.']},
  {t:'Defensive driving', i:[
   '**Look ahead:** scan far ahead, check mirrors every 5–8 seconds, and expect that other road users have not seen you.',
   '**Following distance:** keep at least 3 seconds from the vehicle ahead. Make it 4 seconds or more in rain, at night, or behind trucks.',
   '**Wet roads:** slow down early, brake gently and early, avoid sudden steering. Never drive through floodwater; turn back.',
   '**Night:** dip your lights, do not drive faster than you can stop in your headlight range. If you are dazzled, slow down and look to the left edge of the road.',
   '**Motorbikes and pedestrians:** check blind spots, give space, and never turn without looking twice.',
   '**Oil-palm and heavy trucks:** stay out of their blind spots, never overtake on bends or hill crests, expect wide turns, and watch for fruit or oil on the road.',
   '**Fatigue:** sleep at least 7 hours before a long run. Take a break at least every 2 hours. If sleepy, pull over safely, rest or swap, and tell your supervisor. Do not rush to meet a flight.',
   '**Passengers:** seatbelts on before moving, no overloading, no loose heavy items.',
   '**Breakdown:** hazard lights on, move passengers to a safe place away from traffic, set the warning triangle, and call your supervisor.']},
  {t:'Odometer familiarisation', i:[
   'In the Driver Log you take an odometer photo at the **start** of your shift and at the **end** of the day.',
   'The photo must be taken **live in the app** with the camera. Gallery photos are not accepted. The photo carries the date and time, and the app shows a disclaimer about it.',
   'Show **all the digits** clearly. No glare, no blur, and do not cover the display.',
   'Type the reading **exactly as shown**, in whole kilometres. The **trip meter is not the odometer**. Never reset anything.',
   'If the odometer is broken, stuck or replaced, report it to your coordinator before driving.']},
  {t:'Kilometre tracking', i:[
   'Distance for the shift = **end reading − start reading**. Example: start 45,210 and end 45,298 means 88 km.',
   'Log **every shift** and every vehicle you use, with the correct vehicle plate.',
   'Today\'s start reading should equal yesterday\'s end reading. A gap means a trip that was not logged. Tell your coordinator; do not change the numbers.',
   'Use the vehicle only for the work assigned to you (site shuttle, airport and other approved trips).',
   'Wrong entry by mistake? Tell your coordinator straight away. Honest corrections are fine; hidden ones are not.']},
  {t:'Incident reporting', i:[
   '**Report everything:** crashes, near misses, any vehicle damage (even a scratch), injuries, unsafe roads or site conditions, and any security event.',
   '**First actions after an incident:** 1) stop and make the scene safe (hazard lights, engine off, triangle); 2) check people and call the emergency number {{emergency}}; 3) do not move the vehicle unless it is unsafe to leave it; 4) call your supervisor and the HSSE/security contact immediately; 5) give facts only and take photos if safe.',
   '**Then record it** in the Driver Log (Incident / near-miss field) at the end of the shift. The phone call comes first, within minutes, not hours.',
   'Reporting is never punished. **Hiding an incident is.**']},
  {t:'Warnings for violations', i:[
   '**Any violation** of these rules — including failing this induction, unsafe driving, falsifying records, or repeated safety flags on your daily log — is handled through EcoOils\' standard warning system: **SP1** (first written warning), **SP2** (second written warning), and **SP3** (third and final written warning).',
   '**SP3 is final.** Repeating a violation after SP3 can lead to removal from the project.',
   'Warnings are issued by the HSSE officer based on the facts of what happened — never automatically by this app.',
   'This standard applies to every company on site. Your own subcontracting agency is responsible for any disciplinary action taken against you under their own terms of employment.']}
 ],
 id:[
  {t:'Informasi lokasi untuk pengemudi lintas', i:[
   '**Peran Anda:** Anda mengantar karyawan dan tamu dari/ke lokasi Mentari, bandara dan tempat lain. Anda hanya melintas di lokasi. Anda **tidak** bekerja di lokasi.',
   '**Gerbang:** berhenti di pos keamanan, tunjukkan KTP, SIM dan dokumen kendaraan, dan ikuti arahan petugas. Gerbang masuk: {{gate}}.',
   '**Rute:** gunakan hanya rute yang disetujui: {{route}}. Tidak boleh jalan pintas. Jangan masuk area konstruksi atau zona berpagar.',
   '**Titik turun / jemput:** {{pickup}}. Jangan parkir di bawah crane atau area pengangkatan, dan jangan menghalangi jalan atau akses darurat.',
   '**Kecepatan di lokasi:** {{speed}}. Beri jalan kepada truk, crane dan alat berat, dan tetap berada di tempat yang terlihat operator.',
   '**Penumpang** turun hanya di titik turun dan mengikuti aturan APD yang diberikan di gerbang.',
   '**Alkohol dan narkoba:** toleransi nol, sebelum maupun saat mengemudi. Merokok hanya di area yang ditentukan.',
   '**Alarm darurat:** berhenti dengan aman jauh dari jalan, bawa penumpang ke titik kumpul {{assembly}} dan tunggu arahan HSSE. Kontak darurat: {{emergency}}.']},
  {t:'Aturan Keselamatan Jiwa yang berlaku untuk Anda', i:[
   '**Mengemudi:** semua orang memakai sabuk pengaman sebelum kendaraan berjalan. Patuhi batas kecepatan. Tidak memakai HP saat mengemudi, termasuk hands-free. Tidak alkohol atau narkoba. Jangan mengemudi saat lelah.',
   '**Posisi aman (garis tembak):** jauhi jalur kendaraan, alat dan beban yang bergerak. Jika harus berhenti, berhentilah di tempat yang terlihat dan di luar jalur.',
   '**Beban menggantung:** jangan mengemudi, parkir atau berdiri di bawah beban yang sedang diangkat. Berhenti jauh dan tunggu.',
   '**Area terkontrol:** jangan masuk area yang diberi pembatas, pita atau tanda bahaya (area izin kerja, ruang terbatas, galian, area gas), meski untuk menghemat waktu.',
   '**Hentikan dan laporkan:** Anda berwenang menghentikan situasi tidak aman dan melapor ke keamanan atau HSSE. Anda tidak akan dihukum karena berhenti dengan aman.']},
  {t:'Mengemudi defensif', i:[
   '**Lihat jauh ke depan:** pindai jauh ke depan, cek spion setiap 5–8 detik, dan anggap pengguna jalan lain tidak melihat Anda.',
   '**Jarak aman:** minimal 3 detik dari kendaraan di depan. Jadikan 4 detik atau lebih saat hujan, malam hari, atau di belakang truk.',
   '**Jalan basah:** kurangi kecepatan lebih awal, rem pelan dan lebih awal, hindari membelok mendadak. Jangan menerobos banjir; putar balik.',
   '**Malam hari:** gunakan lampu dekat, jangan melaju lebih cepat dari jarak henti Anda. Jika silau, perlambat dan lihat tepi kiri jalan.',
   '**Sepeda motor dan pejalan kaki:** cek titik buta, beri ruang, dan jangan berbelok tanpa melihat dua kali.',
   '**Truk sawit dan kendaraan berat:** jauhi titik butanya, jangan menyalip di tikungan atau puncak tanjakan, antisipasi belokan lebar, dan waspadai buah atau minyak di jalan.',
   '**Kelelahan:** tidur minimal 7 jam sebelum perjalanan jauh. Istirahat minimal setiap 2 jam. Jika mengantuk, menepi dengan aman, istirahat atau bergantian, dan beri tahu atasan. Jangan terburu-buru mengejar penerbangan.',
   '**Penumpang:** sabuk pengaman terpasang sebelum jalan, tidak melebihi kapasitas, tidak ada barang berat lepas.',
   '**Mogok:** nyalakan lampu hazard, pindahkan penumpang ke tempat aman jauh dari lalu lintas, pasang segitiga pengaman, dan hubungi atasan.']},
  {t:'Pengenalan odometer', i:[
   'Di Driver Log Anda memotret odometer di **awal** shift dan di **akhir** hari.',
   'Foto harus diambil **langsung di aplikasi** dengan kamera. Foto dari galeri tidak diterima. Foto memuat tanggal dan jam, dan aplikasi menampilkan pemberitahuan tentang hal ini.',
   'Tampilkan **semua angka** dengan jelas. Tanpa silau, tanpa blur, dan jangan menutupi layar.',
   'Ketik angka **persis seperti yang tampak**, dalam kilometer penuh. **Trip meter bukan odometer**. Jangan reset apa pun.',
   'Jika odometer rusak, macet atau diganti, laporkan ke koordinator sebelum mengemudi.']},
  {t:'Pencatatan kilometer', i:[
   'Jarak shift = **angka akhir − angka awal**. Contoh: awal 45.210 dan akhir 45.298 berarti 88 km.',
   'Catat **setiap shift** dan setiap kendaraan yang Anda pakai, dengan nomor polisi yang benar.',
   'Angka awal hari ini harus sama dengan angka akhir kemarin. Selisih berarti ada perjalanan yang tidak dicatat. Beri tahu koordinator; jangan ubah angkanya.',
   'Gunakan kendaraan hanya untuk tugas yang diberikan (antar-jemput lokasi, bandara dan perjalanan resmi lain).',
   'Salah mengisi? Segera beri tahu koordinator. Koreksi yang jujur tidak masalah; yang disembunyikan tidak boleh.']},
  {t:'Pelaporan insiden', i:[
   '**Laporkan semuanya:** tabrakan, nyaris celaka, kerusakan kendaraan sekecil apa pun (termasuk goresan), cedera, jalan atau kondisi lokasi tidak aman, dan kejadian keamanan.',
   '**Tindakan pertama setelah insiden:** 1) berhenti dan amankan lokasi (lampu hazard, mesin mati, segitiga); 2) cek orang dan hubungi nomor darurat {{emergency}}; 3) jangan pindahkan kendaraan kecuali berbahaya jika ditinggal; 4) segera hubungi atasan dan kontak HSSE/keamanan; 5) sampaikan fakta saja dan ambil foto jika aman.',
   '**Lalu catat** di Driver Log (kolom Insiden / nyaris celaka) di akhir shift. Telepon dulu, dalam hitungan menit, bukan jam.',
   'Melapor tidak pernah dihukum. **Menyembunyikan insiden yang dihukum.**']},
  {t:'Peringatan atas pelanggaran', i:[
   '**Setiap pelanggaran** terhadap aturan ini — termasuk gagal tes induksi, mengemudi tidak aman, memalsukan catatan, atau flag keselamatan berulang pada log harian Anda — ditangani melalui sistem peringatan standar EcoOils: **SP1** (Surat Peringatan 1), **SP2** (Surat Peringatan 2), dan **SP3** (Surat Peringatan 3, final).',
   '**SP3** adalah peringatan terakhir. Mengulangi pelanggaran setelah SP3 dapat berakibat pemberhentian dari proyek.',
   'Peringatan diterbitkan oleh petugas HSSE berdasarkan fakta kejadian — bukan secara otomatis oleh aplikasi ini.',
   'Standar ini berlaku untuk semua perusahaan — agen penyalur Anda sendiri bertanggung jawab atas tindakan disiplin yang diambil terhadap Anda sesuai ketentuan kerja mereka.']}
 ],
 ms:[
  {t:'Maklumat tapak untuk pemandu lintasan', i:[
   '**Peranan anda:** anda membawa pekerja dan tetamu ke dan dari tapak Mentari, lapangan terbang dan tempat lain. Anda hanya melalui tapak. Anda **tidak** bekerja di tapak.',
   '**Pintu pagar:** berhenti di pos keselamatan, tunjuk ID, SIM dan dokumen kenderaan, dan ikut arahan pengawal. Pintu masuk: {{gate}}.',
   '**Laluan:** guna hanya laluan yang diluluskan: {{route}}. Tiada jalan pintas. Jangan masuk kawasan pembinaan atau zon berpagar.',
   '**Tempat turun / ambil:** {{pickup}}. Jangan letak kenderaan di bawah kren atau kawasan angkat, dan jangan halang jalan atau akses kecemasan.',
   '**Kelajuan di tapak:** {{speed}}. Beri laluan kepada lori, kren dan jentera berat, dan kekal di tempat yang operator boleh nampak.',
   '**Penumpang** turun hanya di tempat turun dan mengikut peraturan PPE yang diberi di pintu pagar.',
   '**Alkohol dan dadah:** toleransi sifar, sebelum atau semasa memandu. Merokok hanya di kawasan yang ditetapkan.',
   '**Penggera kecemasan:** berhenti dengan selamat jauh dari jalan, bawa penumpang ke tempat berkumpul {{assembly}} dan tunggu arahan HSSE. Hubungan kecemasan: {{emergency}}.']},
  {t:'Peraturan Menyelamatkan Nyawa yang terpakai kepada anda', i:[
   '**Memandu:** semua orang memakai tali pinggang keledar sebelum kenderaan bergerak. Patuhi had laju. Tiada telefon semasa memandu, termasuk hands-free. Tiada alkohol atau dadah. Jangan memandu ketika letih.',
   '**Kedudukan selamat (garis tembakan):** jauhi laluan kenderaan, jentera dan beban yang bergerak. Jika perlu berhenti, berhenti di tempat yang boleh dilihat dan di luar laluan.',
   '**Beban tergantung:** jangan memandu, letak kenderaan atau berdiri di bawah beban yang sedang diangkat. Berhenti jauh dan tunggu.',
   '**Kawasan terkawal:** jangan masuk kawasan yang berpagar, bertape atau bertanda bahaya (kawasan permit, ruang terkurung, korekan, kawasan gas), walaupun untuk jimat masa.',
   '**Henti dan lapor:** anda berkuasa menghentikan keadaan tidak selamat dan memberitahu keselamatan atau HSSE. Anda tidak akan dihukum kerana berhenti dengan selamat.']},
  {t:'Pemanduan defensif', i:[
   '**Lihat ke hadapan:** imbas jauh ke hadapan, semak cermin setiap 5–8 saat, dan anggap pengguna jalan lain tidak nampak anda.',
   '**Jarak mengekor:** sekurang-kurangnya 3 saat dari kenderaan di hadapan. Jadikan 4 saat atau lebih ketika hujan, waktu malam, atau di belakang lori.',
   '**Jalan basah:** perlahan awal, brek perlahan dan awal, elak pusing stereng mengejut. Jangan redah air banjir; berpatah balik.',
   '**Malam:** guna lampu dekat, jangan laju melebihi jarak berhenti anda. Jika silau, perlahankan dan pandang tepi kiri jalan.',
   '**Motosikal dan pejalan kaki:** semak tempat buta, beri ruang, dan jangan membelok tanpa melihat dua kali.',
   '**Lori sawit dan kenderaan berat:** jauhi tempat butanya, jangan memotong di selekoh atau puncak bukit, jangkakan belokan luas, dan awasi buah atau minyak di jalan.',
   '**Keletihan:** tidur sekurang-kurangnya 7 jam sebelum perjalanan jauh. Rehat sekurang-kurangnya setiap 2 jam. Jika mengantuk, berhenti dengan selamat, berehat atau bertukar pemandu, dan beritahu penyelia. Jangan tergesa-gesa mengejar penerbangan.',
   '**Penumpang:** tali pinggang dipasang sebelum bergerak, jangan lebih muatan, tiada barang berat yang longgar.',
   '**Rosak:** pasang lampu kecemasan, pindahkan penumpang ke tempat selamat jauh dari lalu lintas, letak segi tiga amaran, dan hubungi penyelia.']},
  {t:'Pengenalan odometer', i:[
   'Dalam Driver Log anda mengambil gambar odometer pada **awal** syif dan pada **akhir** hari.',
   'Gambar mesti diambil **terus dalam aplikasi** dengan kamera. Gambar daripada galeri tidak diterima. Gambar membawa tarikh dan masa, dan aplikasi memaparkan penafian mengenainya.',
   'Tunjukkan **semua digit** dengan jelas. Tiada silau, tiada kabur, dan jangan tutup paparan.',
   'Taip bacaan **tepat seperti dipaparkan**, dalam kilometer penuh. **Trip meter bukan odometer**. Jangan set semula apa-apa.',
   'Jika odometer rosak, tersangkut atau diganti, laporkan kepada penyelaras sebelum memandu.']},
  {t:'Rekod kilometer', i:[
   'Jarak syif = **bacaan akhir − bacaan awal**. Contoh: awal 45,210 dan akhir 45,298 bermakna 88 km.',
   'Rekod **setiap syif** dan setiap kenderaan yang anda guna, dengan nombor plat yang betul.',
   'Bacaan awal hari ini mesti sama dengan bacaan akhir semalam. Jurang bermakna ada perjalanan yang tidak direkod. Beritahu penyelaras; jangan ubah nombor.',
   'Guna kenderaan hanya untuk tugas yang diberi (ulang-alik tapak, lapangan terbang dan perjalanan rasmi lain).',
   'Tersalah isi? Beritahu penyelaras segera. Pembetulan yang jujur tidak mengapa; yang disorokkan tidak boleh.']},
  {t:'Pelaporan insiden', i:[
   '**Laporkan semuanya:** kemalangan, nyaris celaka, sebarang kerosakan kenderaan (walaupun calar), kecederaan, jalan atau keadaan tapak yang tidak selamat, dan sebarang kejadian keselamatan.',
   '**Tindakan pertama selepas insiden:** 1) berhenti dan selamatkan tempat kejadian (lampu kecemasan, enjin dimatikan, segi tiga); 2) semak orang dan hubungi nombor kecemasan {{emergency}}; 3) jangan alihkan kenderaan kecuali tidak selamat untuk ditinggalkan; 4) hubungi penyelia dan HSSE/keselamatan dengan segera; 5) beri fakta sahaja dan ambil gambar jika selamat.',
   '**Kemudian rekod** dalam Driver Log (ruangan Insiden / nyaris celaka) pada akhir syif. Telefon dahulu, dalam beberapa minit, bukan jam.',
   'Melapor tidak pernah dihukum. **Menyembunyikan insiden yang dihukum.**']},
  {t:'Amaran atas pelanggaran', i:[
   '**Sebarang pelanggaran** terhadap peraturan ini — termasuk gagal induksi ini, memandu tidak selamat, memalsukan rekod, atau flag keselamatan berulang pada log harian anda — dikendalikan melalui sistem amaran standard EcoOils: **SP1** (amaran bertulis pertama), **SP2** (amaran bertulis kedua), dan **SP3** (amaran bertulis ketiga dan terakhir).',
   '**SP3 adalah muktamad.** Mengulangi pelanggaran selepas SP3 boleh menyebabkan penyingkiran daripada projek.',
   'Amaran dikeluarkan oleh pegawai HSSE berdasarkan fakta kejadian — bukan secara automatik oleh aplikasi ini.',
   'Standard ini terpakai kepada semua syarikat di tapak. Agensi subkontrak anda sendiri bertanggungjawab atas sebarang tindakan tatatertib yang diambil ke atas anda mengikut terma pekerjaan mereka sendiri.']}
 ]

 id:[
  {q:'Apa peran Anda saat mengemudi ke lokasi Mentari?',a:['Mengantar orang dari/ke lokasi; saya hanya melintas dan tidak bekerja di lokasi','Membantu kontraktor bekerja sambil menunggu','Parkir di mana saja dekat area kerja','Mengambil material dari area konstruksi']},

  {q:'Crane sedang mengangkat beban di dekat rute Anda. Anda:',a:['Berhenti jauh dan menunggu; jangan lewat di bawah beban','Lewat cepat di bawah beban','Menyalip crane dari kiri','Parkir di bawah lengan crane untuk berteduh']},

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtItem(t){
  let h = esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  h = h.replace(/\{\{(\w+)\}\}/g, (m,k) => SITE[k] ? '<b>'+esc(SITE[k])+'</b>' : '<span class="tbc">('+TBC[lang]+')</span>');
  return h;
}
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function companyName(){ return S.v.company === 'Other' ? S.v.companyOther.trim() : S.v.company; }
function todayStr(){ const d = new Date(); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
function setLang(l){ lang = l; try{ localStorage.setItem('drv_lang', l); }catch(e){} document.documentElement.lang = l; chrome(); render(); }

function detailErrors(){
  const v = S.v, t = L(), e = {};
  if(v.name.trim().length < 3) e.name = t.errName;
  if(!v.company || (v.company==='Other' && v.companyOther.trim().length<2)) e.company = t.errCompany;
  if(v.phone.replace(/\D/g,'').length < 8) e.phone = t.errPhone;
  if(v.licNo.trim().length < 5) e.licNo = t.errLic;
  if(!v.licType) e.licType = t.errLicType;
  if(!v.licExp) e.licExp = t.errExpMissing; else if(v.licExp < todayStr()) e.licExp = t.errExp;
  if(!/^[A-Za-z0-9]{4}$/.test(v.id4.trim())) e.id4 = t.errId;
  return e;
}

function modal(title, body){
  const m = document.createElement('div'); m.className='modal'; m.id='modal';
  m.innerHTML = '<div class="box"><h3>'+esc(title)+'</h3><p>'+esc(body)+'</p><div class="btn-row"><button class="btn btn-primary" id="mx">'+esc(L().close)+'</button></div></div>';
  document.body.appendChild(m);
  const close = () => { m.remove(); document.removeEventListener('keydown', k); };
  const k = e => { if(e.key==='Escape') close(); };
  document.addEventListener('keydown', k);
  m.onclick = e => { if(e.target===m) close(); };
  m.querySelector('#mx').onclick = close;
}

/* live camera only (falls back to the phone camera input if getUserMedia is unavailable) */
function takePhoto(cb){
  const t = L();
  const fallback = () => {
    const i = document.createElement('input'); i.type='file'; i.accept='image/*'; i.setAttribute('capture','environment');
    i.onchange = () => { const f=i.files&&i.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>cb(r.result); r.readAsDataURL(f); };
    i.click();
  };
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ fallback(); return; }
  navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false}).then(stream => {
    const m = document.createElement('div'); m.className='camera-modal';
    m.innerHTML = '<video autoplay playsinline muted></video><div class="cam-top"><button class="cam-x" id="cx">✕</button><span class="cam-hint">'+esc(t.camHint)+'</span></div><div class="cam-bottom"><button class="shutter" id="sh" aria-label="photo"></button></div>';
    document.body.appendChild(m);
    const vid = m.querySelector('video'); vid.srcObject = stream;
    const stop = () => { stream.getTracks().forEach(x=>x.stop()); m.remove(); };
    m.querySelector('#cx').onclick = stop;
    m.querySelector('#sh').onclick = () => {
      const c = document.createElement('canvas'); const w = vid.videoWidth||1280, h = vid.videoHeight||720; const sc = Math.min(1, 1000/Math.max(w,h));
      c.width = Math.round(w*sc); c.height = Math.round(h*sc); c.getContext('2d').drawImage(vid,0,0,c.width,c.height);
      const url = c.toDataURL('image/jpeg',.7); stop(); cb(url);
    };
  }).catch(() => { fallback(); });
}

function vQuizIntro(){
  const t = L();
  $('app').innerHTML = progress(MODS[lang].length/(MODS[lang].length+1)) + '<div class="card"><div class="step-title">'+esc(t.qIntro)+'</div><p>'+esc(t.qIntroBody)+'</p><div class="btn-row"><button class="btn btn-secondary" id="bk">'+esc(t.back)+'</button><button class="btn btn-primary" id="go">'+esc(t.qStart)+'</button></div></div>';
  $('bk').onclick = () => { S.step='mods'; S.mod=MODS[lang].length-1; render(); };
  $('go').onclick = startQuiz;
}
function startQuiz(){
  const idx = shuffle(QB.en.map((_,i)=>i)).slice(0,QUIZ_N);
  S.quiz = idx.map(i => ({ i, order: shuffle([0,1,2,3]) }));
  S.ans = new Array(QUIZ_N).fill(-1); S.qi = 0; S.step='quiz'; render();
}
function vQuiz(){
  const t = L(), q = S.quiz[S.qi], item = QB[lang][q.i];
  const answered = S.ans[S.qi] >= 0;
  const opts = q.order.map(k => {
    let cls = 'opt';
    if(answered){
      if(k===0) cls += ' correct';
      else if(S.ans[S.qi]===k) cls += ' wrong';
    } else if(S.ans[S.qi]===k) cls += ' sel';
    const tag = (answered && k===0) ? ' <span style="font-size:12px;font-weight:700;">✓ '+esc(t.correctLabel)+'</span>' : '';
    return '<button class="'+cls+'" data-k="'+k+'"'+(answered?' disabled':'')+'>'+esc(item.a[k])+tag+'</button>';
  }).join('');
  const last = S.qi === QUIZ_N-1;
  $('app').innerHTML = progress((S.qi)/QUIZ_N) + '<div class="card"><div class="step-title">'+esc(t.question)+' '+(S.qi+1)+' '+esc(t.of)+' '+QUIZ_N+'</div><h2>'+esc(item.q)+'</h2>'+opts+
    '<div class="btn-row">'+(S.qi>0?'<button class="btn btn-secondary" id="bk">'+esc(t.back)+'</button>':'')+'<button class="btn btn-primary" id="nx"'+(S.ans[S.qi]<0?' disabled':'')+'>'+esc(last?t.finish:t.next)+'</button></div></div>';
  if(!answered) document.querySelectorAll('.opt').forEach(b => b.onclick = () => { S.ans[S.qi] = +b.dataset.k; vQuiz(); });
  const bk=$('bk'); if(bk) bk.onclick = () => { S.qi--; vQuiz(); };
  $('nx').onclick = () => { if(last) finishQuiz(); else { S.qi++; vQuiz(); } };
}

function finishQuiz(){
  S.score = S.ans.filter(a => a === 0).length;   // option index 0 is always the correct answer
  S.attempt++; S.step='result'; S.result = null; S.saveState = 'saving';
  const pass = S.score >= PASS_MARK;
  S.clientId = 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
  S.payload = { action:'driverInduction', clientId:S.clientId, name:S.v.name.trim(), company:companyName(), phone:S.v.phone.trim(), licenceNo:S.v.licNo.trim(),
    licenceType:S.v.licType, licenceExpiry:S.v.licExp, idLast4:S.v.id4.trim().toUpperCase(), plate:S.v.plate.trim(), lang:lang, score:S.score, outOf:QUIZ_N };
  render(); send();
}
function send(){
  S.saveState = 'saving'; draw();
  fetch(SCRIPT_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(S.payload) })
    .then(r => r.json()).then(j => {
      if(j && j.status === 'ok'){ S.result = j; S.saveState = 'saved'; try{ localStorage.removeItem('drv_pending'); }catch(e){} }
      else { S.saveState = 'fail'; keep(); }
      draw();
    }).catch(() => { S.saveState = 'fail'; keep(); draw(); });
}
function keep(){ try{ localStorage.setItem('drv_pending', JSON.stringify(S.payload)); }catch(e){} }
function draw(){ if(S.step==='result') vResult(true); }

function vResult(keepScroll){
  const t = L(), pass = S.score >= PASS_MARK;
  let h = '<div class="card" style="text-align:center"><div class="step-title">'+esc(t.score)+'</div><div class="big '+(pass?'pass':'failc')+'">'+S.score+' / '+QUIZ_N+'</div><h2 class="'+(pass?'pass':'failc')+'" style="margin-top:6px">'+esc(pass?t.pass:t.fail)+'</h2>';
  h += '<p class="muted">'+esc(S.saveState==='saving'?t.saving:S.saveState==='saved'?t.saved:t.saveFail)+'</p>';
  if(S.saveState==='fail') h += '<div class="btn-row"><button class="btn btn-primary" id="rs">'+esc(t.retrySave)+'</button></div>';
  h += '</div>';
  if(!pass){
    h += '<div class="card"><p>'+esc(t.retryBody)+'</p><div class="btn-row"><button class="btn btn-secondary" id="rv">'+esc(t.review)+'</button><button class="btn btn-primary" id="rt">'+esc(t.retry)+'</button></div></div>';
  } else if(S.saveState==='saved' && S.result && S.result.code){
    h += '<div class="card"><div class="step-title">'+esc(t.certTitle)+'</div><canvas id="certCv" width="1200" height="850"></canvas><div class="btn-row"><button class="btn btn-primary" id="dl">'+esc(t.dl)+'</button></div><div class="note info">'+esc(t.signNote)+'</div></div>';
  }
  $('app').innerHTML = h;
  const rs=$('rs'); if(rs) rs.onclick = send;
  const rt=$('rt'); if(rt) rt.onclick = startQuiz;
  const rv=$('rv'); if(rv) rv.onclick = () => { S.step='mods'; S.mod=0; render(); };
  if(pass && S.saveState==='saved' && S.result && S.result.code){ drawCert($('certCv')); $('dl').onclick = () => { const a=document.createElement('a'); a.download='Driver-Induction-'+S.result.certNo+'.png'; a.href=$('certCv').toDataURL('image/png'); a.click(); }; }
  if(!keepScroll) window.scrollTo(0,0);
}

function drawCert(cv){
  const c = cv.getContext('2d'), W = cv.width, H = cv.height, r = S.result, v = S.v, t = L();
  c.fillStyle='#fff'; c.fillRect(0,0,W,H);
  c.fillStyle='#44a276'; c.fillRect(0,0,W,16); c.fillRect(0,H-16,W,16);
  c.fillStyle='#FFC600'; c.fillRect(60,64,70,6);
  c.textBaseline='alphabetic';
  c.fillStyle='#44a276'; c.font='700 30px Jost, sans-serif'; c.fillText('ECOOILS', 60, 56);
  c.fillStyle='#6e6b6c'; c.font='300 24px Jost, sans-serif'; c.fillText('SEI MANGKEI', 215, 56);
  c.fillStyle='#231f20'; c.font='300 44px Jost, sans-serif'; c.fillText('DRIVER FAMILIARIZATION & AWARENESS', 60, 160);
  c.fillStyle='#6e6b6c'; c.font='400 24px Jost, sans-serif'; c.fillText('Mentari Project · Commuter & pass-through drivers', 60, 210);
  c.fillStyle='#231f20'; c.font='600 56px Jost, sans-serif'; c.fillText(v.name.trim().toUpperCase().slice(0,32), 60, 320);
  c.fillStyle='#6e6b6c'; c.font='400 30px Jost, sans-serif'; c.fillText(companyName(), 60, 366);
  const rows = [['Certificate no.', r.certNo],['Induction date', todayStr()],['Valid until', r.validUntil||''],['Score', S.score+' / '+QUIZ_N+'  PASS'],['SIM', '•••• '+v.licNo.trim().slice(-4)+'  ('+v.licType+')']];
  rows.forEach((x,i)=>{ const y=450+i*58; c.fillStyle='#8a8788'; c.font='400 24px Jost, sans-serif'; c.fillText(x[0], 60, y); c.fillStyle='#231f20'; c.font='500 30px Jost, sans-serif'; c.fillText(x[1], 330, y); });
  // QR
  try{
    const q = QRCodeLib(0,'M'); q.addData(VERIFY_BASE+'?code='+r.code); q.make();
    const n = q.getModuleCount(), cell = Math.floor(230/(n+2)), size = cell*(n+2), ox = W-60-size, oy = 400;
    c.fillStyle='#fff'; c.fillRect(ox,oy,size,size); c.fillStyle='#000';
    for(let y=0;y<n;y++) for(let x=0;x<n;x++) if(q.isDark(y,x)) c.fillRect(ox+(x+1)*cell, oy+(y+1)*cell, cell, cell);
    c.fillStyle='#6e6b6c'; c.font='400 20px Jost, sans-serif'; c.textAlign='center'; c.fillText('Scan to verify', ox+size/2, oy+size+28); c.fillText(r.code, ox+size/2, oy+size+54); c.textAlign='left';
  }catch(e){}
  c.fillStyle='#6e6b6c'; c.font='400 17px Jost, sans-serif';
  c.fillText('This certificate confirms completion of site familiarization & awareness training only.', 60, H-150);
  c.fillText('It is not proof of employment as a direct employee of EcoOils.', 60, H-126);
  c.fillText('The holder is employed by their own subcontracting agency, under a contract for services with EcoOils.', 60, H-102);
  c.fillText('Valid only with HSSE officer sign-off (shown on the verification page).', 60, H-70);
  c.fillText('Personal data is held confidentially in the EcoOils HSSE driver register.', 60, H-42);
  c.save(); c.translate(W/2,H/2+60); c.rotate(-0.45); c.fillStyle='rgba(68,162,118,0.07)'; c.font='700 110px Jost, sans-serif'; c.textAlign='center'; c.fillText('ECOOILS · SEI MANGKEI', 0, 0); c.restore();
}

/* =============================== VERIFY PAGE =============================== */
function vVerify(){
  const t = L(), code = S.code;
  $('app').innerHTML = '<div class="card"><div class="step-title">'+esc(t.verTitle)+'</div><p id="vr">'+esc(t.verChecking)+'</p></div>';
  fetch(SCRIPT_URL+'?action=driverInductionVerify&code='+encodeURIComponent(code)).then(r=>r.json()).then(j => {
    const el = $('vr'); if(!el) return;
    if(j.status !== 'ok'){ el.innerHTML = '<span class="tag bad">'+esc(t.verNo)+'</span>'; return; }
    const ok = !j.expired;
    el.outerHTML = '<h2 class="'+(ok?'pass':'failc')+'">'+esc(ok?t.verOk:t.verExpired)+'</h2>'+
      '<table class="t"><tr><th>'+esc(t.verName)+'</th><td>'+esc(j.name)+'</td></tr><tr><th>'+esc(t.verCo)+'</th><td>'+esc(j.company)+'</td></tr><tr><th>'+esc(t.verNum)+'</th><td>'+esc(j.certNo)+'</td></tr><tr><th>'+esc(t.verDate)+'</th><td>'+esc(j.date)+'</td></tr><tr><th>'+esc(t.verUntil)+'</th><td>'+esc(j.validUntil)+'</td></tr></table>'+
      '<p style="margin-top:12px"><span class="tag '+(j.signoff==='Signed'?'ok':'wait')+'">'+esc(j.signoff==='Signed'?t.verSigned:t.verPending)+'</span></p>';
  }).catch(() => { const el=$('vr'); if(el) el.textContent = t.offline; });
}

/* =============================== OFFICER SIGN-OFF =============================== */
const O = { email:'', token:'', step:'login', rows:[], sel:null, tab:'pending', q:'', msg:'', sim:false, veh:false, route:false, notes:'' };
function post(body){ return fetch(SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)}).then(r=>r.json()); }
function vOfficer(){
  const t = L();
  if(!O.token){
    const sent = O.step === 'code';
    $('app').innerHTML = '<div class="card"><div class="step-title">'+esc(t.officer)+'</div>'+
      '<div class="field"><label>'+esc(t.oEmail)+'</label><input id="oe" type="email" autocomplete="email" value="'+esc(O.email)+'"></div>'+
      (sent?'<div class="field"><label>'+esc(t.oCode)+'</label><input id="oc" inputmode="numeric" maxlength="6"></div>':'')+
      (O.msg?'<div class="err" style="color:#b3261e;font-size:13px;margin-bottom:8px">'+esc(O.msg)+'</div>':'')+
      '<div class="btn-row"><button class="btn btn-secondary" id="bk">'+esc(t.back)+'</button><button class="btn btn-primary" id="go">'+esc(sent?t.oLogin:t.oSend)+'</button></div></div>';
    $('bk').onclick = () => { S.step='welcome'; O.msg=''; render(); };
    $('go').onclick = () => {
      O.email = $('oe').value.trim(); O.msg='';
      if(!sent){ post({action:'requestCode',email:O.email}).then(j => { if(j.status==='ok') O.step='code'; else O.msg=j.message||t.offline; vOfficer(); }).catch(()=>{O.msg=t.offline;vOfficer();}); }
      else { post({action:'verifyCode',email:O.email,code:$('oc').value.trim()}).then(j => { if(j.status==='ok'){ O.token=j.token; loadList(); } else { O.msg=j.message||t.offline; vOfficer(); } }).catch(()=>{O.msg=t.offline;vOfficer();}); }
    };
    return;
  }
  if(O.sel) return vSign();
  const rows = O.rows.filter(r => (O.tab==='pending' ? r.signoff!=='Signed' : true) && (!O.q || String(r.name).toLowerCase().indexOf(O.q.toLowerCase())>=0));
  $('app').innerHTML = '<div class="card"><div class="step-title">'+esc(t.officer)+'</div>'+
    '<div class="btn-row" style="margin-top:0"><button class="btn '+(O.tab==='pending'?'btn-primary':'btn-secondary')+'" id="t1">'+esc(t.oPending)+'</button><button class="btn '+(O.tab==='all'?'btn-primary':'btn-secondary')+'" id="t2">'+esc(t.oAll)+'</button></div>'+
    '<div class="field" style="margin-top:14px"><input id="oq" placeholder="'+esc(t.oSearch)+'" value="'+esc(O.q)+'"></div>'+
    (O.msg?'<div class="note info">'+esc(O.msg)+'</div>':'')+
    (rows.length ? '<table class="t">'+rows.map((r,i)=>'<tr data-c="'+esc(r.code)+'" style="cursor:pointer"><td><b>'+esc(r.name)+'</b><br><span class="muted">'+esc(r.company)+' · '+esc(r.date)+'</span></td><td style="text-align:right"><span class="tag '+(r.signoff==='Signed'?'ok':'wait')+'">'+esc(r.signoff==='Signed'?'✓':'…')+'</span></td></tr>').join('')+'</table>' : '<p class="muted">'+esc(t.oNone)+'</p>')+
    '<div class="btn-row"><button class="btn btn-secondary" id="bk">'+esc(t.back)+'</button></div></div>';
  $('t1').onclick=()=>{O.tab='pending';vOfficer();}; $('t2').onclick=()=>{O.tab='all';vOfficer();};
  $('oq').oninput = e => { O.q=e.target.value; const p=e.target.selectionStart; vOfficer(); const el=$('oq'); el.focus(); try{el.setSelectionRange(p,p);}catch(x){} };
  $('bk').onclick = () => { S.step='welcome'; render(); };
  document.querySelectorAll('tr[data-c]').forEach(tr => tr.onclick = () => { O.sel = O.rows.find(r=>r.code===tr.dataset.c); O.sim=O.veh=O.route=false; O.notes=''; O.msg=''; vOfficer(); });
}
function loadList(){ post({action:'listDriverInductions',token:O.token}).then(j => { if(j.status==='ok'){ O.rows=j.rows; } else { O.msg=j.message||''; O.token=''; } vOfficer(); }).catch(()=>{O.msg=L().offline; vOfficer();}); }
function vSign(){
  const t = L(), r = O.sel, done = r.signoff==='Signed';
  $('app').innerHTML = '<div class="card"><div class="step-title">'+esc(t.officer)+'</div><h2>'+esc(r.name)+'</h2>'+
    '<table class="t"><tr><th>'+esc(t.company)+'</th><td>'+esc(r.company)+'</td></tr><tr><th>'+esc(t.phone)+'</th><td>'+esc(r.phone)+'</td></tr><tr><th>SIM</th><td>'+esc(r.licenceNo)+' · '+esc(r.licenceType)+' · '+esc(r.licenceExpiry)+'</td></tr><tr><th>'+esc(t.plate)+'</th><td>'+esc(r.plate||'—')+'</td></tr><tr><th>'+esc(t.score)+'</th><td>'+esc(r.score)+' / '+esc(r.outOf)+'</td></tr><tr><th>'+esc(t.verUntil)+'</th><td>'+esc(r.validUntil)+'</td></tr></table>'+
    (done?'<div class="note info">'+esc(t.oDone)+' '+esc(r.signedBy||'')+'</div>':
     '<label class="confirm-gate"><input type="checkbox" id="c1"><span>'+esc(t.oSim)+'</span></label><label class="confirm-gate"><input type="checkbox" id="c2"><span>'+esc(t.oVeh)+'</span></label><label class="confirm-gate"><input type="checkbox" id="c3"><span>'+esc(t.oRoute)+'</span></label>'+
     '<div class="field" style="margin-top:14px"><label>'+esc(t.oNotes)+'</label><input id="on" maxlength="200"></div>')+
    (O.msg?'<div class="note danger">'+esc(O.msg)+'</div>':'')+
    '<div class="btn-row"><button class="btn btn-secondary" id="bk">'+esc(t.oBackList)+'</button>'+(done?'':'<button class="btn btn-primary" id="sg" disabled>'+esc(t.oSign)+'</button>')+'</div></div>';
  $('bk').onclick = () => { O.sel=null; O.msg=''; vOfficer(); };
  if(done) return;
  const chk = () => { $('sg').disabled = !($('c1').checked && $('c2').checked && $('c3').checked); };
  ['c1','c2','c3'].forEach(i => $(i).onchange = chk);
  $('sg').onclick = () => {
    $('sg').disabled = true;
    post({action:'signoffDriverInduction',token:O.token,code:r.code,sim:true,vehicle:true,route:true,notes:$('on').value.trim()}).then(j => {
      if(j.status==='ok'){ r.signoff='Signed'; O.msg=t.oDone; O.sel=null; vOfficer(); } else { O.msg=j.message||t.offline; vSign(); }
    }).catch(()=>{ O.msg=t.offline; vSign(); });
  };
}

/* =============================== START =============================== */
(function init(){
  document.documentElement.lang = lang;
  const code = new URLSearchParams(location.search).get('code');
  if(code){ S.step='verify'; S.code=code; }
  chrome(); render();
  try{ const p = localStorage.getItem('drv_pending'); if(p && !code){ /* a finished result that did not reach the register is re-sent silently */
    const pl = JSON.parse(p); fetch(SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(pl)}).then(r=>r.json()).then(j=>{ if(j&&j.status==='ok') localStorage.removeItem('drv_pending'); }).catch(()=>{}); } }catch(e){}
})();
</script>
